name: CI & Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Tests run on Windows, and not out of preference: the gui package imports
  # Wails, whose Linux backend needs CGO/GTK, so `go test ./...` does not even
  # compile on the Ubuntu runner. It is the same reason .goreleaser.yml forces
  # GOOS=windows for its before-hooks.
  test:
    name: Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Test
        run: go test ./...

  build:
    name: Build (all branches)
    runs-on: ubuntu-latest
    needs: test
    if: "!startsWith(github.ref, 'refs/tags/')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install tools
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Build with GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: build --snapshot --clean

  release:
    name: Release (on signed tag on master)
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A published release is installed by the About tab with one click, so
      # what gets published has to be what the maintainer meant to publish.
      # The key is pinned rather than merely "some key on the account": importing
      # the account's keys is how the public half is obtained, not what is
      # trusted. Rotating the release key means updating this fingerprint.
      - name: Verify the tag is signed by the release key
        env:
          RELEASE_KEY: A65914635785FF2DC0D955E51329E77EDFDF4C79
        run: |
          curl -sSf https://github.com/yesnault.gpg | gpg --import
          git verify-tag --raw "$GITHUB_REF_NAME" 2>&1 \
            | grep -q "VALIDSIG $RELEASE_KEY" \
            || { echo "::error::$GITHUB_REF_NAME is not signed by the release key"; exit 1; }

      - name: Verify the tag is on master
        run: |
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master \
            || { echo "::error::$GITHUB_REF_NAME does not point at a commit on master"; exit 1; }

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install tools
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      # Publishes the archive and checksums.txt beside it. The self-updater
      # refuses to install anything the checksums file does not cover, so this
      # asset is not optional.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
