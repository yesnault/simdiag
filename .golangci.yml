linters:
  enable:
    - gofmt
    # Already enabled
    - dupl
    - gocritic
    - staticcheck

    # Error checking
    - errcheck
    - govet

    # Dead/unused code
    - unused
    - ineffassign

    # Code simplification
    - gosimple
    - unconvert

    # Code quality
    - gocyclo
    - goimports
    - revive
    # - misspell
    

linters-settings:
  dupl:
    threshold: 100

  errcheck:
    check-blank: false  # Allow intentional error ignoring with _

  gocyclo:
    min-complexity: 20

  govet:
    enable:
      - assign
      - atomic

  revive:
    severity: warning
    rules:
      # --- Naming & style ---
      - name: var-naming
      - name: package-comments
      - name: exported
      - name: receiver-naming

      # --- Code quality ---
      - name: early-return
      - name: unnecessary-stmt
      - name: redundant-import-alias
      - name: empty-lines

      # --- Errors & correctness ---
      - name: errorf
      - name: error-naming
      - name: error-return
      - name: indent-error-flow

      # --- Logic & maintainability ---
      - name: confusing-naming
      - name: modifies-parameter
      - name: deep-exit
      # [max statements, max lines]. The line budget is the looser of the two so
      # that flat lookup tables (scan-code and key-name maps) stay in one piece.
      - name: function-length
        arguments: [60, 150]

      # --- Dead / useless code ---
      - name: unused-parameter
      - name: blank-imports

issues:
  exclude-rules:
    # Table-driven tests are long and branchy by construction; the size limits
    # exist to keep production logic decomposable, not to cap test tables.
    - path: _test\.go
      linters:
        - gocyclo
        - dupl
      text: ""
    - path: _test\.go
      linters:
        - revive
      text: "function-length"